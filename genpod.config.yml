# -------------------------------------------------------------------
# Genpod configuration
# -------------------------------------------------------------------

schema_version: '1.0'

default:
  # Default LLM config used when agent‑specific overrides are absent
  llm_config:
    provider: openai
    model: gpt-4o-2024-11-20
    config:
      top_p: 0.4
      temperature: 0.3
      max_retries: 3
      streaming: true
  max_retries: 3               # Fallback retry count
  retry_backoff: 3             # Fallback backoff in seconds
  max_graph_recursion_limit: 1000

# Reusable Anthropic/Claude anchor for all 3.5‑based agents
claude_base: &claude_base
  llm_config:
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    config:
      streaming: true

agents:
  supervisor:
    description: Oversees and coordinates the task execution of other agents, ensuring efficiency and alignment.
  architect:
    llm_config:
      provider: openai
      model: gpt-4o-2024-11-20
      config:
        top_p: 0.4
        temperature: 0.5
        max_retries: 3
    description: Designs the high-level system and architecture, creating project requirements.
  coder:
    description: Writes and optimizes code, focusing on clean practices and performance.
  research:
    description: Conducts in-depth research by aggregating and synthesizing online sources for actionable insights.
  rag_middleware:
    description: Mediates the RAG flow—selects the right RAG agent, forwards queries, and returns answers.
  planner:
    description: Manages planning, timelines, and task prioritization for smooth progress.
  tests_generator:
    # <<: *claude_base
    description: Generates and validates test cases to ensure standards and quality checks are met.
  reviewer:
    description: Reviews code, suggests improvements, and ensures outputs meet quality and performance standards.

rag_agents: {}

max_graph_recursion_limit: 10000

providers:
  openai:
    setting:
      api_key: $OPENAI_API_KEY
      max_retries: 3
      retry_backoff: 3
    models:
      chatgpt-4o-latest:
        description: The latest version of ChatGPT, optimized for dynamic and conversational AI tasks.
        api_key: null
      gpt-4o-2024-11-20:
        description: GPT-4 model from the November 2024 release, offering advanced reasoning and understanding.
        api_key: null
      gpt-4o-2024-08-06:
        description: GPT-4 model from the August 2024 release, optimized for efficient throughput.
        api_key: null
      gpt-4o-2024-05-13:
        description: GPT-4 model from the May 2024 release, balanced for performance and context handling.
        api_key: null
      o1-preview-2024-09-12:
        description: OpenAI One preview model released in September 2024, early access for emerging use cases.
        api_key: null
      o1-mini-2024-09-12:
        description: Compact version of OpenAI One preview model from September 2024, optimized for low-latency.
        api_key: null
      gpt-3.5-turbo:
        description: GPT-3.5 Turbo, a high-throughput model for fast conversational responses.
        api_key: null
      o3-mini:
        description: Compact version of OpenAI's GPT-4 optimized for efficient inference and lower latency.
        api_key: null

  ollama:
    setting:
      api_key: ''
    models:
      llama3:
        description: Llama3, a high-performance open-source LLM for general understanding and generation.
        api_key: null

  anthropic:
    setting:
      api_key: $ANTHROPIC_API_KEY
    models:
      claude-3-5-sonnet-20240620:
        description: Claude 3.5 Sonnet released June 2024, balanced performance for chat and reasoning.
        api_key: null
      claude-3-5-sonnet-20241022:
        description: Claude 3.5 Sonnet updated October 2024 with improved context handling and stability.
        api_key: null
      claude-3-7-sonnet-20250219:
        description: Claude 3.7 Sonnet released February 2025, enhanced reasoning and knowledge capabilities.
        api_key: null
      claude-instant-1.2:
        description: Claude Instant v1.2, optimized for low-latency, high-throughput applications.
        api_key: null

  google:
    setting:
      api_key: $GOOGLE_API_KEY
    models:
      gemini-2.5-pro-preview-05-06:
        description: Gemini 2.5 Pro preview, supports text, image, video, and audio inputs with advanced reasoning.
        api_key: null
      gemini-2.5-flash-preview-04-17:
        description: Gemini 2.5 Flash preview, ultra-fast inference with optional “thinking” mode for deeper reasoning.
        api_key: null
      gemini-2.0-flash:
        description: Gemini 2.0 Flash, token-based pricing model for text and audio inputs with fast text outputs.
        api_key: null
      gemini-2.0-flash-lite:
        description: Gemini 2.0 Flash Lite, lightweight variant optimized for low-latency and cost-effective throughput.
        api_key: null
