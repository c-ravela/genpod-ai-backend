delegator_prompt_template:
  template: |
    You are a Supervisor of a team who always tracks the status of the project and the tasks. \n 
    Active team members are: \n\n {team_members} \n\n
    What do each team member do:\n
    Architect: ['Creates Requirements document','Creates Deliverables','Answers any additional information']
    RAG: Contains proprietary information so must be called when such information is needed

    If the document contains keywords related to the user question, grade it as relevant. \n
    It does not need to be a stringent test. The goal is to filter out erroneous retrievals. \n
    Give a binary score 'yes' or 'no' score to indicate whether the document is relevant to the question. \n
    Provide the binary score as a JSON with a single key 'score' and no preamble or explanation.

    ### Inverse Prompting:
    If your output does not include:
    - A JSON object with only the key `'score'` and value as either `'yes'` or `'no'`,
    - No preamble, commentary, or formatting beyond the JSON structure,

    Then revise your response to fully meet the expectations above.

response_evaluator_prompt_template:
  template: |
    You are a Supervisor responsible for evaluating the completeness of responses from team members. Your task is to determine if a given response requires additional information or clarification.

    Current team members: {team_members}

    Response to evaluate: {response}

    Original user query: {user_query}

    Evaluation criteria:
    1. Does the response fully address the user's query?
    2. Is the information provided clear and comprehensive?
    3. Are there any obvious gaps or missing details in the response?
    4. Would the user likely need to ask follow-up questions based on this response?

    Provide a binary assessment as a JSON with a single key 'needs_additional_info'. Use 'true' if the response requires more information, and 'false' if it's complete and satisfactory. Do not include any explanation or preamble in your output.

    Example output:
    {"needs_additional_info": true}
    or
    {"needs_additional_info": false}

    ### Inverse Prompting:
    If your output does not include:
    - Only one JSON key `'needs_additional_info'` with a boolean value (`true` or `false`),
    - No explanation or additional formatting outside the JSON block,

    Then revise your response to fully meet the expectations above.

architect_call_prompt_template:
  template: |
    This task is part of Project Initiation Phase and has two deliverables, a project requirements document and a list of project deliverables.\n
    Do not assume anything and request for additional information if provided information is not sufficient to complete the task or something is missing.

additional_info_req_prompt_template:
  template: |
    A fellow agent is stuck with something and is requesting additional info on the question

init_rag_questionaire_prompt_template:
  template: |
    Given the user prompt:
    ```user_prompt
    {user_prompt}
    ```

    Generate a comprehensive list of questions to query the knowledge base which is a vector DB.

    These questions should cover various aspects of the project requirements,
    technical specifications, and industry standards. Focus on the following areas:
        1. Industry standards and regulations
        2. Project-specific requirements
        3. Data management

    Create a list response which contains one well-defined question for each
    category that will help extract detailed information from our knowledge base
    to assist in creating a comprehensive requirements document.

    example output format: "['question1','question2','question3']"
    Use this additional context if an error exists in output: {context}

    ### Inverse Prompting:
    If your output does not include:
    - A list with one relevant, domain-specific question per category,
    - Only well-formed questions inside a single-line list format (as shown in the example),
    - No commentary or extra text,

    Then revise your response to fully meet the expectations above.

follow_up_questions_template:
  template: |
    Given the original user query and the initial RAG response:

    User query: "{user_query}"

    Initial RAG response:
    {initial_rag_response}

    Evaluate the response based on the following criteria:
    1. Relevance to the original query
    2. Completeness of information
    3. Technical accuracy
    4. Clarity and coherence

    Determine if the response is complete or if a follow-up query is needed.

    If the response is complete, output:
    COMPLETE
    [Provide a brief summary of why the response is considered complete]

    If the response is incomplete or inadequate, output:
    INCOMPLETE
    [Briefly explain why the response is incomplete]
    Follow-up Query: [Provide a single, focused query to retrieve all the missing information]

    ### Inverse Prompting:
    If your output does not include:
    - Either `COMPLETE` or `INCOMPLETE` as the first line,
    - A justification following that label,
    - If `INCOMPLETE`, a clearly written follow-up query relevant to the missing details,

    Then revise your response to fully meet the expectations above.

ideal_init_rag_questionaire_prompt_template:
  template: |
    Given the user prompt: "{user_prompt}", generate a comprehensive list of questions to query the knowledge base which is a vector DB. 
    These questions should cover various aspects of the project requirements, technical specifications, and industry standards. Focus on the following areas:
        1. Industry standards and regulations
        2. Project-specific requirements
        3. Technical architecture
        4. API design (if applicable)
        5. Implementation details
        6. Data management
        7. Security and compliance
        8. Performance and scalability
        9. Testing and validation
        10. Documentation and specifications

    Create a list response which contains one well-defined question for each category that will help extract 
    detailed information from our knowledge base to assist in creating a comprehensive requirements document.

    example output format: "['question1','question2','question3']"
    Use this additional context if an error exists in output: {context}

    ### Inverse Prompting:
    If your output does not include:
    - A total of 10 distinct, well-scoped questions—one for each of the 10 categories,
    - Output in list format exactly like: `['question1', 'question2', ...]`,
    - No additional explanation or formatting outside the list,

    Then revise your response to fully meet the expectations above.
