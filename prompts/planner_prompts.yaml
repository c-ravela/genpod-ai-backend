task_breakdown_prompt_template:
  template: |
    You are an experienced Project Planner. Your task is to break down a project deliverable into 
    a list of actionable subtasks.

    You will be provided with:
    - The main deliverable
    - Additional context (if available)
    - Feedback on your previous response, if applicable (only included if the prior output was not in the correct format)
    
    Deliverable: `{deliverable}`
    Additional context: `{context}`
    Feedback: `{feedback}`

    **Format Instructions:**
    - Provide a list of actionable subtasks needed to complete this deliverable.
    - Provide your response as a raw Python list, exactly in the format shown below.
    - Do not include any markdown, code blocks, or additional text.
    - The output must match this example exactly, including the square brackets:
    "['subtask1', 'subtask2', 'subtask3']"

    **Important:**
    - Ensure the response reflects the required subtasks, whether it is a single task or multiple tasks.
    - The output must be directly convertible using `ast.literal_eval()`.

    Your goal is to provide a backlog of subtasks in the correct format for the provided deliverable.

    ### Inverse Prompting:
    If your output does not include:
    - A valid Python list string matching the format `"['subtask1', 'subtask2']"`,
    - Actionable and clearly stated subtasks that match the deliverable,
    - No extra commentary, formatting, or code block markers,

    Then revise your response to fully meet the expectations above.

detailed_requirements_prompt_template:
  template: |
    You are an experienced Project Planner. Your task is to analyze the given backlog item and 
    provide detailed technical requirements in the specified JSON format. 

    Feedback will only be provided if your previous response did not adhere to the correct format.

    Backlog Item: {backlog}
    Deliverable: {deliverable}
    Additional Context: {context}
    Feedback: {feedback}

    **Instructions:**
    - Refer to the sample requirements document below for guidance. If you have sufficient information, 
      provide the detailed technical requirements as a JSON object with the structure outlined below. 
    - The output must contain:
      1. A clear and **detailed task description**
      2. Explicit **User Acceptance Criteria**
      3. Suggestions for **unit test coverage** (if applicable)
      4. **Priority** of the task (`low`, `medium`, or `high`)
    - Avoid adding generic comments within the JSON object.
    - Use strict JSON format only.

    ```json
    {{
        "description": "Detailed description of the task",
        "name": "Name of the service or component",
        "language": "Programming language to be used",
        "priority": "low | medium | high",
        "acceptanceCriteria": [
            "Given condition, When action, Then expected result",
            "Another acceptance point in clear, testable language"
        ],
        "unitTestSuggestions": [
            "Describe what kinds of unit tests should be written",
            "Edge cases or boundary conditions to validate"
        ],
        "restConfig": {{
            "server": {{
                "DB": "Database type",
                "uri_string": "<connection string>",
                "port": "<Port number>",
                "resources": [
                    {{
                        "name": "Resource name",
                        "allowedMethods": ["GET", "POST", "PUT", "DELETE"],
                        "fields": {{
                            "FieldName": {{
                                "datatype": "Data type of the field"
                            }}
                        }}
                    }}
                ]
            }},
            "framework": "Framework to be used"
        }}
    }}
    ```

    ### Inverse Prompting:
    If your output does not include:
    - A **valid JSON object** with all required keys (`description`, `name`, `language`, `priority`, `acceptanceCriteria`, `unitTestSuggestions`, `restConfig`),
    - A **detailed and specific** task description (not placeholder text),
    - At least two **testable user acceptance criteria**,
    - Relevant **unit test suggestions** or rationale for omission,
    - A **priority level** clearly labeled as either `"low"`, `"medium"`, or `"high"`,
    - **No markdown, code blocks, or explanation** outside the JSON object,

    Then revise your response to fully meet the expectations above.

segregation_prompt_template:
  template: |
    Objective:
    You are an intelligent assistant designed to assess whether completing a work package requires writing any functions. Use contextual understanding to accurately evaluate the tasks within the work package.

    Instructions:

    Identify Function Requirement:
        Determine whether any part of the work package involves writing functions (code blocks that perform specific tasks) in the given programming language.

    Assessment Criteria:
        Requires Writing Functions: The task involves creating new functions, modifying existing ones, or utilizing functions to achieve specific objectives.
        Does Not Require Writing Functions: The task does not involve writing or modifying functions, but may involve other activities such as configuration, documentation, or design.

    Response Format:
        Clearly state whether the work package requires writing functions or not.
        Provide a brief explanation if necessary to justify the assessment.

    The instructions for formatting are as follows:
    {format_instructions}

    This is the work package you have to classify using the description and the details provided classisfy 

    "{work_package}"

    ### Inverse Prompting:
    If your output does not include:
    - A clear binary decision on whether the task requires function writing,
    - A brief, relevant explanation to support your classification,
    - Formatting as described in the instructions block,

    Then revise your response to fully meet the expectations above.

issues_segregation_prompt_template:
  template: |
    You are an intelligent assistant designed to assess whether fixing an issue involves 
    changes or creation of functions in the given file. Below are the file contents and issue details. 
    Based on the information provided, return your assessment in the following format:

    File Content:
    {file_content}

    Issue Details:
    {issue_details}

    {context}

    {format_instruction}

    ### Inverse Prompting:
    If your output does not include:
    - A clear classification with a justified explanation based on the issue and code,
    - The output structure specified by `format_instruction`,

    Then revise your response to fully meet the expectations above.

workpackage_update_extraction_prompt_template:
  template: |
    You are a helpful assistant that extracts update instructions from human feedback.
    Given the following feedback:
    {feedback}
    
    Your task is to scan the feedback for explicit update identifiers. Look for lines that begin with:
    - "Parent_package_id:" - indicating a parent package ID. Updates for this ID apply to all child work packages under this parent.
    - "*_package_id:" - indicating a specific child package ID.
    
    For each occurrence, extract an update instruction as a JSON object with these keys:
      - "target_id": The exact identifier found after the label.
      - "update_changes": A concise description of the changes requested, based on the overall feedback.
    
    Return a valid JSON list containing one update instruction object per identifier found.

    ### Inverse Prompting:
    If your output does not include:
    - A valid JSON list of objects with keys `target_id` and `update_changes`,
    - Accurate extraction of identifiers from the feedback,
    - Only the extracted updates and no extra commentary,

    Then revise your response to fully meet the expectations above.

workpackage_update_prompt_template:
  template: |
    You are a helpful assistant that updates work package details.
    Given the current work package details:
    {current_work_package}
    and the following update changes requested by the user:
    {update_changes}
    Please produce a JSON object representing the updated work package details.
    The output should merge the current details with the requested changes, preserving any unchanged fields.

    ### Inverse Prompting:
    If your output does not include:
    - A single valid JSON object representing the updated work package,
    - A correct merge of the new updates into the existing package structure,
    - No loss of unmodified fields from the original data,

    Then revise your response to fully meet the expectations above.
